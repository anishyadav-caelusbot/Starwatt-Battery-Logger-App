services:
  backend:
    build: ./backend
    container_name: batterylogger-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - INFLUX_URL=${INFLUX_URL:-http://host.docker.internal:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-starwatt}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-philips}
      - MOCK_MODE=${MOCK_MODE:-true}
      - ADMIN_USER=${ADMIN_USER:-starwatt}
      - ADMIN_PASS=${ADMIN_PASS:-Superman$12}
    volumes:
      - backend-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build: ./frontend
    container_name: batterylogger-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
    driver: local
